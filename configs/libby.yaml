pretrained_model_path: "/local_codes/pretrain/stable-diffusion-2-1-base/"
pretrained_unet_path: "/local_codes/code/VideoEditing/outputs/libby/"
output_dir: "./outputs/libby"

train_data:
  video_path: "data/libby.mp4"
  prompt: "a german shepherd dog running through the grass"
#  prompt: "a rasadf fox"
  n_sample_frames: 12
  width: 512
  height: 512
  sample_start_idx: 0
  sample_frame_rate: 1

validation_data:
  prompts:
    - "a fox is running through the grass"
    - "a cat is running through the grass"
#    - "a rasadf fox running through the grass"
  video_length: 12
  width: 512
  height: 512
  num_inference_steps: 50
  guidance_scale: 12.5
  use_inv_latent: True
  num_inv_steps: 50

learning_rate: 3e-5
train_batch_size: 1
max_train_steps: 500
checkpointing_steps: 1000
validation_steps: 500
trainable_modules:
  - "attn1.to_q"
  - "attn2.to_q"
  - "attn_temp"
  - "attn3"
  - "depth_proj_dict"

seed: 33
mixed_precision: fp16
use_8bit_adam: False
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True